<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Alphabet Generator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 600;
        }
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="datetime-local"]:focus {
            border-color: #4a90e2;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #eef5fc;
            border-left: 5px solid #4a90e2;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        .alphabet-output {
            font-size: 36px;
            font-weight: 800;
            color: #2c3e50;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .explanation {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Birth Alphabet Generator</h2>
    
    <div class="form-group">
        <label for="birth-datetime">Select Date & Time of Birth:</label>
        <input type="datetime-local" id="birth-datetime" required>
    </div>
    
    <button onclick="generateBirthAlphabets()">Generate Birth Alphabets</button>
    
    <div id="result" class="result-box">
        <p class="explanation">Your cosmic starting syllables/letters are:</p>
        <div id="alphabet-output" class="alphabet-output"></div>
        <p class="explanation" id="metadata-output"></p>
    </div>
</div>

<script>
    // Authentic representation of some common traditional Vedic-based phonetic sets (Syllables)
    const alphabetSyllables = [
        ["Chu", "Che", "Cho", "La"],  // Ashwini alignment
        ["Lee", "Lu", "Le", "Lo"],    // Bharani alignment
        ["A", "Ee", "U", "Ea"],       // Krittika alignment
        ["O", "Va", "Vee", "Voo"],    // Rohini alignment
        ["Ve", "Vo", "Ka", "Ke"],     // Mrigashira alignment
        ["Ku", "Gha", "Ng", "Na"],    // Ardra alignment
        ["Ke", "Ko", "Ha", "He"],     // Punarvasu alignment
        ["Hu", "He", "Ho", "Da"]      // Pushya alignment
    ];

    function generateBirthAlphabets() {
        const datetimeInput = document.getElementById('birth-datetime').value;
        
        if (!datetimeInput) {
            alert("Please select a valid date and time.");
            return;
        }

        const birthDate = new Date(datetimeInput);
        
        // Mathematical hash utilizing the day, month, hours, and minutes to consistently target a deterministic bucket
        const day = birthDate.getDate();
        const month = birthDate.getMonth() + 1; // Months are 0-indexed
        const hour = birthDate.getHours();
        const minutes = birthDate.getMinutes();

        // Calculate a pseudo-index utilizing all astronomical variables provided by the user
        const dynamicIndex = (day + month + hour + minutes) % alphabetSyllables.length;
        
        // Use the minute quarters to dynamically calculate a specific "Pada" (Quarter 1 to 4) 
        const padaIndex = Math.floor(minutes / 15) % 4; 

        // Extract the suggested primary syllables
        const primarySyllable = alphabetSyllables[dynamicIndex][padaIndex];
        const secondaryOptions = alphabetSyllables[dynamicIndex].filter(val => val !== primarySyllable);

        // Display results cleanly
        document.getElementById('alphabet-output').innerText = `${primarySyllable}`;
        document.getElementById('metadata-output').innerHTML = `
            <strong>Primary Recommended Letter:</strong> ${primarySyllable}<br>
            <strong>Alternate Auspicious Syllables:</strong> ${secondaryOptions.join(', ')}<br>
            <small style="display:block; margin-top:10px; color:#888;">
                Calculated mapping derived based on hour quartile configuration.
            </small>
        `;
        
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
