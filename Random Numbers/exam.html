<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Random Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Part A & Part B</h2>
    <p>Click the button below to generate the random numbers:</p>
    <button onclick="generateNumbers()">Run Program</button>
    
    <p class="result" id="res1">Part A (1 to 6): --</p>
    <p class="result" id="res2">Part B (7 to 12): --</p>
</div>

<script>
    function generateNumbers() {
        // Formula matching C's: (Math.random() * range) + min
        let num1 = Math.floor(Math.random() * 6) + 1; // 1 to 6
        let num2 = Math.floor(Math.random() * 6) + 7; // 7 to 12

        document.getElementById("res1").innerText = "Part A (1 to 6): " + num1;
        document.getElementById("res2").innerText = "Part B (7 to 12): " + num2;
    }
</script>

</body>
</html>
